<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业 AI 机会地图</title><style>
:root{--navy:#182c48;--blue:#326da6;--teal:#267d82;--orange:#da8b3c;--paper:#f7f5f0;--muted:#627083;--line:#d5dce3}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--navy);font:17px/1.65 "Microsoft YaHei",system-ui}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:5px}header{background:var(--navy);color:white;padding:30px max(5vw,24px) 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:14px;letter-spacing:2px;color:#bed0df}.tools{display:flex;gap:20px;align-items:center;font-size:14px}.tools a{text-decoration:none;color:#dce6ef}.tools button{border:1px solid #59718b;color:white;background:transparent;border-radius:6px;padding:6px 14px;font-size:14px}h1{font-size:clamp(34px,4vw,56px);line-height:1.2;margin:34px 0 14px;font-weight:700;letter-spacing:-1px}.intro{margin:0;color:#c4d1df;font-size:20px}.hero-bottom{margin-top:30px;display:flex;gap:30px;color:#a9c4d4;font-size:14px}.hero-bottom strong{color:#ffc383;font-weight:500}main{max-width:1520px;margin:auto;padding:34px max(5vw,24px) 50px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}h2{font-size:26px;margin:0}.sectionhead p{color:var(--muted);font-size:15px;margin:0}.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.area{background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);padding:23px 26px;text-align:left;border-radius:3px;color:var(--navy);transition:transform .2s,box-shadow .2s}.area:hover{transform:translateY(-4px);box-shadow:0 12px 28px #182c4812}.area:nth-child(3n+2){border-top-color:var(--teal)}.area:nth-child(3n){border-top-color:var(--orange)}.num{color:var(--orange);font-size:19px}.area h3{font-size:23px;margin:8px 0}.area p{font-size:15px;color:var(--muted);margin:0 0 17px}.examples{border-top:1px solid #e7ebef;padding-top:14px;font-size:16px;line-height:1.95}.open{display:flex;justify-content:space-between;font-size:13px;color:var(--blue);margin-top:15px}.depth{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);margin-top:36px;padding-top:26px;gap:30px}.depth strong{display:block;font-size:20px;margin-bottom:5px}.depth p{margin:0;color:var(--muted);font-size:15px}.depth span{color:var(--teal);margin-right:12px}footer{max-width:1520px;margin:auto;padding:0 max(5vw,24px) 30px;color:var(--muted);font-size:13px}dialog{border:0;padding:0;width:min(1120px,94vw);max-height:90vh;border-radius:8px;background:var(--paper);color:var(--navy);box-shadow:0 24px 80px #0005}dialog::backdrop{background:#0c1d33b8;backdrop-filter:blur(4px)}.dialoghead{display:flex;justify-content:space-between;align-items:start;gap:20px;padding:25px 32px;background:var(--navy);color:white}.dialoghead h2{font-size:28px;margin:5px 0}.dialoghead p{color:#c4d1df;margin:0;font-size:15px}.close{border:1px solid #698198;background:transparent;color:white;border-radius:4px;padding:6px 13px;white-space:nowrap}.tabs{display:flex;gap:0;padding:0 32px;border-bottom:1px solid var(--line);background:#fff}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:19px 17px;color:var(--muted);font-size:16px}.tabs button[aria-selected=true]{color:var(--teal);border-color:var(--teal);font-weight:700}.detail{padding:28px 32px 32px}.flow{display:grid;grid-template-columns:1fr 35px 1fr 35px 1fr;align-items:start;gap:16px}.flow b{font-size:14px;color:var(--blue);font-weight:500}.flow h3{font-size:21px;margin:8px 0}.flow p{font-size:17px;margin:0}.arrow{color:var(--orange);font-size:28px;padding-top:45px}.review{border-left:3px solid var(--orange);background:#ede9e0;padding:16px 20px;margin-top:28px;font-size:15px}.review strong{display:block;margin-bottom:4px}.question{font-size:20px;color:var(--teal);margin:25px 0 0}.note{font-size:13px;color:var(--muted);margin:10px 0 0}@media(min-width:1500px){.area{padding:28px 30px}.area h3{font-size:26px}}@media(max-width:1000px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-bottom{flex-wrap:wrap;gap:10px 25px}.flow{gap:8px;grid-template-columns:1fr 20px 1fr 20px 1fr}.tabs button{padding:15px 10px;font-size:15px}}@media(max-width:620px){header{padding:22px 22px 30px}.top{align-items:start;flex-direction:column;gap:12px}.tools{gap:18px;font-size:12px}.tools a,.tools button{white-space:nowrap}.tools button{font-size:12px}.intro{font-size:17px}.hero-bottom{display:none}.map{grid-template-columns:1fr}.sectionhead{display:block}.sectionhead p{margin-top:5px}.depth{grid-template-columns:1fr;gap:18px}.dialoghead,.detail{padding:20px}.tabs{padding:0 10px;overflow:auto}.tabs button{flex:1;min-width:105px}.flow{grid-template-columns:1fr}.arrow{padding:0;transform:rotate(90deg);width:28px}.flow p{font-size:16px}.question{font-size:18px}h1{margin-top:28px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.area{transition:none}}@media print{.tools,dialog{display:none}.map{grid-template-columns:repeat(2,1fr)}header{background:white;color:#182c48}.intro,.brand{color:#627083}.area{break-inside:avoid;box-shadow:none}.depth{break-inside:avoid}}
</style></head><body><header><div class="top"><div class="brand">企业 AI 落地 · 业务机会</div><nav class="tools"><a href="ai-roadmap.html">如何开始落地 ↗</a><button id="fullscreen">全屏展示</button></nav></div><h1>企业 AI 机会地图</h1><p class="intro">从熟悉的业务出发，看看哪些工作可以更省力、更清楚、更顺畅。</p><div class="hero-bottom"><span><strong>06</strong> 个业务环节</span><span><strong>18</strong> 项具体工作</span><span>选择一个环节，查看资料、结果与人工把关</span></div></header><main><div class="sectionhead"><h2>哪一项，最像您的日常工作？</h2><p>点击业务环节，展开具体机会</p></div><section class="map" id="map" aria-label="六个业务环节"></section><section class="depth" aria-label="三个应用深度"><div><strong><span>01</span>个人辅助</strong><p>先帮助一个人完成一项具体任务</p></div><div><strong><span>02</span>团队协作</strong><p>统一资料与交接，让同事接着用</p></div><div><strong><span>03</span>系统连接</strong><p>条件成熟后，再连接已有业务系统</p></div></section></main><footer>以上为可讨论的应用方向，需结合实际资料、工作流程与验收条件判断。产品智能化、设备控制等工程方向另行评估。</footer><dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialoghead"><div><div class="brand" id="phase"></div><h2 id="dialog-title"></h2><p id="value"></p></div><button class="close" id="close">关闭 ×</button></div><div class="tabs" id="tabs" role="tablist" aria-label="具体任务"></div><div class="detail" id="detail" role="tabpanel"></div></dialog><script>
const data=[{"id": "1", "name": "市场与销售", "value": "让客户信息更清楚，让跟进更有准备", "phase": "从了解客户到准备方案", "tasks": [{"title": "客户研究与拜访准备", "input": "客户公开介绍、产品信息和本次拜访目标", "process": "归纳业务线索，标出信息来源和待了解的问题", "output": "一页客户概览与交流重点", "review": "核对主体、来源和时效；推测不能当作事实。"}, {"title": "询盘与需求整理", "input": "客户邮件、沟通记录、产品资料和需求单模板", "process": "提取要求，区分已确认信息和缺失项", "output": "需求确认单与待补充清单", "review": "销售核对关键要求；价格、交期与承诺由负责人确认。"}, {"title": "内容与方案初稿", "input": "客户问题、已确认产品资料和品牌表达要求", "process": "组织内容结构，生成有依据的文案或方案初稿", "output": "可修改的内容稿与方案框架", "review": "审核事实、适用条件和对外表达，不能编造案例或效果。"}]}, {"id": "2", "name": "客服与知识服务", "value": "让资料找得到，让回答有依据", "phase": "从问题接收到服务响应", "tasks": [{"title": "产品与制度问答", "input": "现行产品手册、制度文件及访问权限", "process": "查找相关内容，附上出处；缺依据时明确提示", "output": "带来源的回答与原文定位", "review": "维护版本与权限；例外情况交给业务人员判断。"}, {"title": "售后问题归类", "input": "工单、客户描述和处理记录", "process": "整理故障现象与已尝试操作，建议问题类别", "output": "工单摘要与转交信息", "review": "复杂故障由专业人员诊断，不自动作出维修或赔付承诺。"}, {"title": "新人上手助手", "input": "岗位流程、常见问题和经审核的示例", "process": "按任务提供资料入口与操作提示", "output": "岗位学习路径与工作检查清单", "review": "实际操作授权和考核由主管负责。"}]}, {"id": "3", "name": "研发与技术支持", "value": "减少资料整理，把精力留给专业判断", "phase": "从技术需求到评审准备", "tasks": [{"title": "技术资料检索", "input": "授权技术文档、图纸说明和版本记录", "process": "定位相关段落，汇总依据与待核实项", "output": "带出处的技术资料摘要", "review": "由工程人员核对版本、单位及适用条件。"}, {"title": "规格与版本对比", "input": "两份规格文件或不同版本的技术要求", "process": "整理差异、遗漏与需要确认的条款", "output": "规格差异表与评审问题清单", "review": "关键参数和符合性结论必须专业复核。"}, {"title": "测试报告初稿", "input": "原始测试记录、报告模板和检验标准", "process": "按模板整理数据与现象，标记缺失内容", "output": "可追溯的报告初稿", "review": "计算与判定按确定规则校验，放行结论由授权人员签署。"}]}, {"id": "4", "name": "采购、生产与交付", "value": "让单据更一致，让异常更早被看见", "phase": "从采购需求到订单交付", "tasks": [{"title": "采购报价整理", "input": "供应商报价、采购需求与统一字段模板", "process": "提取规格、数量、价格及附加条件，标出缺项", "output": "便于比较的报价信息表", "review": "核对税费、单位、有效期；采购决策与审批由人负责。"}, {"title": "订单与单据核对", "input": "订单、确认单和物料基础资料", "process": "对照字段与约定规则，提示不一致之处", "output": "差异清单与待确认项目", "review": "金额、库存等依系统和规则计算，关键变更需审批。"}, {"title": "异常汇总与工单交接", "input": "异常记录、班组记录与处理进度", "process": "归纳现象、已采取措施和未完成事项", "output": "异常摘要与交接清单", "review": "处置方案及设备操作由授权人员确认。"}]}, {"id": "5", "name": "财务、人事与行政", "value": "减少重复整理，让日常事务更顺畅", "phase": "从材料收集到事务处理", "tasks": [{"title": "单据信息整理", "input": "授权单据、字段定义及业务分类规则", "process": "提取字段，标记缺失或识别不确定的信息", "output": "待核对的结构化台账", "review": "金额、税务与记账依专业规则复核，不自动付款。"}, {"title": "招聘材料整理", "input": "岗位要求和授权使用的候选人材料", "process": "按岗位相关条件汇总经历，标注需面谈核实项", "output": "面试准备摘要与核实问题", "review": "招聘人员核对事实与公平性，不自动作出录用决定。"}, {"title": "会议行动事项", "input": "经同意取得的会议记录和任务模板", "process": "归纳决定、待办、负责人及日期，区分未定事项", "output": "会议纪要与行动清单", "review": "参会人确认责任与时间后，再进入正式任务流程。"}]}, {"id": "6", "name": "经营管理", "value": "让信息更集中，让讨论更有依据", "phase": "从数据汇总到管理跟进", "tasks": [{"title": "经营数据汇总", "input": "已核对报表、指标口径和统计周期", "process": "汇总关键变化，标明数据来源与缺口", "output": "经营摘要与会议材料", "review": "数字由系统或规则计算；先核对口径，再解读变化。"}, {"title": "指标变化分析", "input": "同口径历史数据及相关业务记录", "process": "定位变化，列出可供验证的原因假设", "output": "异常线索与进一步核查清单", "review": "相关性不等于原因，管理人员结合业务验证。"}, {"title": "重点事项跟踪", "input": "已确认的任务、责任人和进度记录", "process": "归纳延误、依赖与待协调事项", "output": "进度摘要与协调议题", "review": "责任调整、资源安排和经营决策由负责人确定。"}]}];const $=id=>document.getElementById(id);let active=0;const dialog=$('detail-dialog');
data.forEach((g,i)=>{const b=document.createElement('button');b.className='area';b.setAttribute('aria-haspopup','dialog');b.innerHTML=`<span class="num">0${i+1}</span><h3>${g.name}</h3><p>${g.value}</p><div class="examples">${g.tasks.map(t=>t.title).join('<br>')}</div><div class="open"><span>查看具体机会</span><span aria-hidden="true">↗</span></div>`;b.onclick=()=>openGroup(i);$('map').append(b)});
function openGroup(i){active=i;const g=data[i];$('phase').textContent=g.phase;$('dialog-title').textContent=g.name;$('value').textContent=g.value;$('tabs').replaceChildren();g.tasks.forEach((t,j)=>{const b=document.createElement('button');b.textContent=t.title;b.id='task-'+j;b.setAttribute('role','tab');b.setAttribute('aria-controls','detail');b.onclick=()=>showTask(j);b.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const k=(j+(e.key==='ArrowRight'?1:2))%3;showTask(k);$('task-'+k).focus()}};$('tabs').append(b)});showTask(0);dialog.showModal()}
function showTask(j){const t=data[active].tasks[j];[...$('tabs').children].forEach((b,k)=>{b.setAttribute('aria-selected',String(j===k));b.tabIndex=j===k?0:-1});$('detail').setAttribute('aria-labelledby','task-'+j);$('detail').innerHTML=`<div class="flow"><section><b>输入</b><h3>准备什么资料</h3><p>${t.input}</p></section><span class="arrow" aria-hidden="true">→</span><section><b>处理</b><h3>AI 可以辅助什么</h3><p>${t.process}</p></section><span class="arrow" aria-hidden="true">→</span><section><b>输出</b><h3>得到什么结果</h3><p>${t.output}</p></section></div><div class="review"><strong>人工把关</strong>${t.review}</div><p class="question">如果用于您的团队，哪一步最值得先改善？</p><p class="note">场景示意；实际效果需通过真实样本验证。</p>`}
$('close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullscreen').textContent='请按 F11 全屏'}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏展示'});
</script></body></html>
