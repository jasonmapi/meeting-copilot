<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业 AI 落地 · 找到适合您的第一步</title><style>*{box-sizing:border-box}body{margin:0;background:#101e32;color:#fff;font:16px "Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column}nav{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 4vw;color:#c4d1df;font-size:14px}a{color:inherit;text-decoration:none}main{flex:1;display:grid;place-items:center;min-height:0}img{display:block;width:min(100vw,calc((100vh - 140px)*16/9));max-height:calc(100vh - 140px);object-fit:contain}footer{display:flex;justify-content:center;align-items:center;gap:22px;padding:18px}button{font:inherit;border:1px solid #637a93;background:#233d5b;color:#fff;border-radius:5px;padding:9px 18px;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #da8b3c;outline-offset:4px}.hint{font-size:12px;color:#94abc0}#count{min-width:65px;text-align:center}@media(max-width:600px){.hint{display:none}nav{font-size:12px;flex-wrap:wrap}footer{gap:12px}button{padding:9px 12px}img{width:100vw}}@media print{nav,footer{display:none}body{background:white}main{display:block}img{width:100%;max-height:none}}</style></head><body><nav><a href="ai-opportunity-map.html">← 企业 AI 机会地图</a><span>企业 AI 落地 · 找到适合您的第一步</span><button id="full">全屏展示</button></nav><main><img id="slide" src="ai-roadmap-1.png" alt="第1页：从有人会用，到企业持续用好"></main><footer><button id="prev">上一页</button><span id="count" aria-live="polite"></span><button id="next">下一页</button><span class="hint">方向键翻页 · Home 回到首页</span></footer><script>let n=1;const titles=['从有人会用，到企业持续用好','第一件事，选得准才容易做成','先让一件事走完，再判断是否扩大','把一个想法，变成第一步'];const $=id=>document.getElementById(id);function show(k){n=Math.max(1,Math.min(4,k));$('slide').src='ai-roadmap-'+n+'.png';$('slide').alt='第'+n+'页：'+titles[n-1];$('count').textContent=n+' / 4';$('prev').disabled=n===1;$('next').disabled=n===4} $('prev').onclick=()=>show(n-1);$('next').onclick=()=>show(n+1);document.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(n+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(n-1)}if(e.key==='Home'){e.preventDefault();show(1)}};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('full').textContent='请按 F11 全屏'}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'退出全屏':'全屏展示'});show(1);for(let i=2;i<=4;i++){let im=new Image();im.src='ai-roadmap-'+i+'.png'}</script></body></html>
